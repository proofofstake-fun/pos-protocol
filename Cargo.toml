[workspace]
resolver = "2"
members = [
    "programs/fee-stake",
    "crates/stake-math",
]

[workspace.package]
# Rust bundled with Solana platform-tools (cargo build-sbf). Keep the lockfile within it.
rust-version = "1.84.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
